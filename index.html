<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ginkgo</title>
    <link rel="stylesheet" href="./styles/base.css">
    <link rel="stylesheet" href="./styles/settings.css">
    <link rel="stylesheet" href="./styles/markdown.css">
    <link rel="stylesheet" href="./styles/filetree.css">
    <link rel="stylesheet" href="./styles/visualizer.css">
    <link rel="stylesheet" href="./styles/sidebar.css">
    <link rel="icon" type="image/x-icon" href="./assets/ginkgo-tree.svg">
    <script src="lib/d3.min.js"></script>
    <script src="lib/3d-force-graph.min.js"></script>
</head>
<body>
    <main id="page">
        <ul id="nav-bar">
            <li id="open-files-btn" class="nav-item"></li>
            <li id="settings-btn" class="nav-item"></li>
            <li id="visualizer-btn" class="nav-item"></li>
            <li id="daily-note-btn" class="nav-item"></li>
        </ul>
        <div id="filetree">
            <h3 id="ginkgo-title">Ginkgo</h3>
            <div id="pinned"></div>
            <div id="files-container"></div>
        </div>
        <div id="file-display">
            <div id="tab-bar"></div>
            <div id="current-tab"></div>
        </div>
        <div id="right-sidebar">
            <div id="right-sidebar-btn" class="closed-sidebar"></div>
            <div id="right-sidebar-nav">
                <button id="add-module-btn">+</button>
            </div>
            <div id="sidebar-contents">
            </div>
        </div>
    </main>
    <dialog id="search-menu">
        <div>
            <input type="text" id="search-bar">
            <div id="search-results"></div>
        </div>
    </dialog>
    <dialog id="settings">
        <div id="settings-nav">
            <div class="settings-nav-item" id="appearance-btn">Appearance</div>
            <div class="settings-nav-item" id="flashcard-btn">Flashcards</div>
            <div class="settings-nav-item" id="pomodoro-btn">Pomodoro Timer</div>
        </div>
        <div id="settings-output"></div>
        <button id="close-settings-btn">X</button> 
    </dialog>

    <script type="module" src="js/main.js" ></script>
</body>
</html>
